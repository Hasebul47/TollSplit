name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.2)'
        required: false
        default: '1.0.2'
        type: string
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      create_release:
        description: 'Publish as GitHub Release (for auto-update)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Determine Version
        id: version_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            VERSION="${RAW_TAG#v}"
          elif [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION="${{ github.event.inputs.version_name }}"
          else
            VERSION="1.0.2"
          fi
          echo "VERSION_NAME=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
          echo "Building Version: $VERSION (Code: ${{ github.run_number }})"

      - name: Decode Google Services (if secret is provided)
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
            echo "Successfully injected google-services.json from GitHub Secrets"
          else
            echo "Using repository app/google-services.json"
          fi

      - name: Build Android APKs
        run: |
          ./gradlew assembleRelease assembleDebug -PversionName=$VERSION_NAME -PversionCode=$VERSION_CODE --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release_apks
          cp app/build/outputs/apk/release/*.apk release_apks/TollSplit-v${VERSION_NAME}-release.apk || true
          cp app/build/outputs/apk/debug/*.apk release_apks/TollSplit-v${VERSION_NAME}-debug.apk || true

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            app/build/reports/
            **/build/reports/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TollSplit-v${{ env.VERSION_NAME }}-APKs
          path: release_apks/*.apk
          retention-days: 14

      - name: Create GitHub Release with APK (on tag or manual release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          files: release_apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
